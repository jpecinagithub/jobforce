# JOBFORCE — integración continua (GitHub Actions)
#
# Qué hace (en cada push a main y en cada pull request):
#   1. Instala con pnpm (versión fijada en package.json → packageManager) vía corepack.
#   2. Typecheck completo: compila todos los paquetes y pasa `tsc --noEmit` en cada uno
#      (`pnpm typecheck` en la raíz = build + typecheck de todos los workspace).
#   3. Tests: ejecuta `pnpm -r --if-present test`.
#      - Los tests del backend (`@jobforce/backend`) necesitan PostgreSQL real:
#        se levanta un servicio postgres:16-alpine (la misma imagen que compose)
#        y se expone DATABASE_URL solo para el paso de tests.
#      - Los tests de paquetes (autonomy, connectors, eval, search) no necesitan red ni claves.
#
# Node 22: es el motor declarado en package.json (engines) y el que corre en Oracle.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    # Red de seguridad: si algo se cuelga, el job falla a los 30 min en vez
    # de agotar el límite de 6 h de GitHub (pasó 24 veces, 2026-10-19/20).
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobforce
          POSTGRES_PASSWORD: jobforce
          POSTGRES_DB: jobforce_test
        # OBLIGATORIO declarar `ports:`: sin esta clave el contenedor se crea
        # SIN publicar ningún puerto y los pasos del job (que corren en el
        # host, no en un contenedor) no pueden conectar -> todos los tests
        # de backend caían con ECONNREFUSED. Con `- 5432` GitHub publica el
        # 5432 del contenedor en un puerto ALEATORIO del host (publicar un
        # puerto fijo sería `- "5432:5432"`, que es lo que chocaba).
        # El puerto real se inyecta en DATABASE_URL con job.services.postgres.ports.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U jobforce -d jobforce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activar pnpm vía corepack
        run: corepack enable

      - name: Install (lockfile congelado)
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck (build + tsc --noEmit en todos los paquetes)
        run: corepack pnpm typecheck

      # Los tests de backend de la Fase 7 generan PDF reales: necesitan el
      # Chromium de Playwright (resuelto desde ~/.cache/ms-playwright por
      # packages/docs/src/browser.ts) y poppler (pdfinfo/pdftotext).
      - name: Chromium de Playwright + poppler (tests con PDF reales)
        run: |
          corepack pnpm --filter @jobforce/backend exec playwright-core install chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Tests
        env:
          DATABASE_URL: postgres://jobforce:jobforce@localhost:${{ job.services.postgres.ports[5432] }}/jobforce_test
        run: corepack pnpm -r --workspace-concurrency=1 --if-present test
